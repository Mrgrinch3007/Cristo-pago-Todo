<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo — Jesús Pagó Todo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .receipt {
    width: 320px;
    background: #fffdf5;
    color: #111;
    padding: 24px 20px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    position: relative;
  }
  /* serrated edges */
  .receipt::before, .receipt::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 12px;
    background: radial-gradient(circle, #e8e8e8 4px, transparent 5px) repeat-x;
    background-size: 12px 12px;
  }
  .receipt::before { top: -6px; }
  .receipt::after { bottom: -6px; }

  .header { text-align: center; margin-bottom: 14px; }
  .header h1 {
    font-size: 26px;
    letter-spacing: 3px;
    font-weight: bold;
  }
  .header .tagline {
    font-size: 13px;
    margin-top: 4px;
    border-top: 1px dashed #999;
    border-bottom: 1px dashed #999;
    padding: 4px 0;
    letter-spacing: 1px;
  }

  .items { margin: 12px 0; }
  .item {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    line-height: 1.9;
  }
  .item .label { text-transform: uppercase; letter-spacing: 1px; }
  .item .paid { font-weight: bold; }

  .totals { border-top: 1px dashed #999; margin-top: 12px; padding-top: 8px; }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    line-height: 1.8;
  }
  .row.total { font-weight: bold; font-size: 16px; }

  .meta { text-align: center; font-size: 11px; color: #555; margin-top: 6px; letter-spacing: 1px; }

  .verse {
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    border-top: 1px dashed #999;
    padding-top: 12px;
  }
  .verse .ref { font-weight: bold; margin-top: 6px; letter-spacing: 1px; }

  .barcode {
    margin: 14px auto 4px;
    height: 40px;
    width: 100%;
    background: repeating-linear-gradient(
      90deg,
      #111 0 2px, transparent 2px 4px,
      #111 4px 7px, transparent 7px 9px,
      #111 9px 10px, transparent 10px 13px,
      #111 13px 16px, transparent 16px 18px
    );
  }

  .footer { text-align: center; font-weight: bold; letter-spacing: 4px; font-size: 18px; margin-top: 6px; }

  .actions { margin-top: 20px; display: flex; gap: 10px; }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 18px;
    border: 2px solid #111;
    background: #fff;
    cursor: pointer;
    letter-spacing: 1px;
  }
  button:hover { background: #111; color: #fff; }

  @media print {
    body { background: #fff; padding: 0; }
    .receipt { box-shadow: none; width: 300px; }
    .actions { display: none; }
  }
</style>
</head>
<body>

  <div class="receipt">
    <div class="header">
      <h1>SALVACIÓN</h1>
      <div class="tagline">JESUS PAGO TODO</div>
    </div>

    <div class="items" id="items"></div>

    <div class="totals">
      <div class="row"><span>FECHA</span><span id="fecha"></span></div>
      <div class="row"><span>VUELTO</span><span>0.00</span></div>
      <div class="row"><span>SUBTOTAL</span><span>0.00</span></div>
      <div class="row total"><span>TOTAL</span><span>0.00</span></div>
    </div>

    <div class="meta">********* 0000 &nbsp;&nbsp; XX/XX</div>

    <div class="verse">
      Pues la paga que deja el pecado es la muerte,<br>
      pero el regalo que Dios da es la vida eterna<br>
      por medio de Cristo Jesús nuestro Señor
      <div class="ref">ROMANOS 6:23</div>
    </div>

    <div class="barcode"></div>
    <div class="footer">VIDA ETERNA</div>
  </div>

  <div class="actions">
    <button onclick="window.print()">Imprimir</button>
    <button onclick="resetFecha()">Actualizar fecha</button>
  </div>

<script>
  const items = [
    'PECADO', 'VERGÜENZA', 'ERRORES PASADOS',
    'HERIDAS', 'ENOJO', 'RECHAZO', 'ODIO'
  ];

  const itemsEl = document.getElementById('items');
  items.forEach(nombre => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span class="label">${nombre}</span><span class="paid">PAGADO</span>`;
    itemsEl.appendChild(div);
  });

  function setFecha() {
    const ahora = new Date();
    const dd = String(ahora.getDate()).padStart(2, '0');
    const mm = String(ahora.getMonth() + 1).padStart(2, '0');
    const yyyy = ahora.getFullYear();
    document.getElementById('fecha').textContent = `${dd}/${mm}/${yyyy}`;
  }
  setFecha();

  function resetFecha() { setFecha(); }
</script>

</body>
</html>
